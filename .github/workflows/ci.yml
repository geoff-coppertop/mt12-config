name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  devcontainer-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run unit tests
        run: uv run --frozen python -m unittest alerts.test_gen_alerts tools.test_card
